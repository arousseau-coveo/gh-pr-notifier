name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node syntax check
        run: node --check poll.mjs

      - name: Bash syntax check
        run: bash -n install.sh run.sh set-token.sh

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh run.sh set-token.sh

      - name: Validate JSON (config.example.json)
        run: node -e "JSON.parse(require('fs').readFileSync('config.example.json','utf8'))"
